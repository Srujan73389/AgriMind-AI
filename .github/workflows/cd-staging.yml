name: CD Staging

on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        run: |
          docker build -f services/api/Dockerfile -t ${{ steps.login-ecr.outputs.registry }}/agrimind-api:${{ github.sha }} .
          docker push ${{ steps.login-ecr.outputs.registry }}/agrimind-api:${{ github.sha }}

      - name: Deploy to ECS Staging
        run: |
          aws ecs update-service \
            --cluster agrimind-staging \
            --service api \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster agrimind-staging \
            --services api

      - name: Run smoke tests
        run: |
          curl -f https://staging.api.agrimind.ai/health || exit 1
