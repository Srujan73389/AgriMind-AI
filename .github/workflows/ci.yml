name: CI

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install ruff mypy bandit pip-audit
      - name: Ruff lint
        run: ruff check services/ packages/ ml/
      - name: Mypy
        run: mypy services/ --ignore-missing-imports
      - name: Bandit security
        run: bandit -r services/ -ll
      - name: Pip audit
        run: pip-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ESLint
        run: cd apps/web && npm ci && npx eslint src/ --max-warnings 0

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run unit tests
        run: poetry run pytest tests/unit/ --cov=services --cov-report=xml -v
      - name: Upload coverage
        uses: codecov/codecov-action@v4

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16-latest
        env:
          POSTGRES_DB: agrimind_test
          POSTGRES_USER: agrimind
          POSTGRES_PASSWORD: testpassword
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://agrimind:testpassword@localhost:5432/agrimind_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          OPENAI_API_KEY: sk-test-dummy
        run: poetry run pytest tests/integration/ -v

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f services/api/Dockerfile -t agrimind/api:${{ github.sha }} .
      - name: Build AI image
        run: docker build -f services/ai/Dockerfile -t agrimind/ai:${{ github.sha }} .
